<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Gallery | RAC SOUTH TIMES</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

body{
    margin:0;
    font-family:Poppins,sans-serif;
    background:#f5f7fb;
}

/* Header */

.gallery-header{

    background:linear-gradient(135deg,#005DAA,#00386d);

    color:white;

    text-align:center;

    padding:80px 20px;

}

.gallery-header h1{

    font-size:52px;

    margin-bottom:15px;

}

.gallery-header p{

    font-size:18px;

}

/* Filter */

.filter{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:15px;

    padding:40px;

}

.filter button{

    border:none;

    padding:12px 25px;

    border-radius:30px;

    background:#005DAA;

    color:white;

    cursor:pointer;

    transition:.3s;

    font-weight:600;

}

.filter button:hover,

.filter button.active{

    background:#F7A81B;

    color:#111;

}

/* Gallery */

.gallery{

    width:90%;

    max-width:1400px;

    margin:auto;

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

    gap:25px;

    padding-bottom:80px;

}

.item{

    overflow:hidden;

    border-radius:18px;

    cursor:pointer;

    position:relative;

    box-shadow:0 15px 35px rgba(0,0,0,.12);

}

.item img{

    width:100%;

    height:260px;

    object-fit:cover;

    transition:.5s;

}

.item:hover img{

    transform:scale(1.12);

}

.overlay{

    position:absolute;

    inset:0;

    background:rgba(0,93,170,.75);

    display:flex;

    justify-content:center;

    align-items:center;

    opacity:0;

    transition:.4s;

}

.item:hover .overlay{

    opacity:1;

}

.overlay i{

    color:white;

    font-size:42px;

}

/* Lightbox */

.lightbox{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.95);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:99999;

}

.lightbox img{

    max-width:90%;

    max-height:85%;

    border-radius:15px;

}

.close{

    position:absolute;

    top:25px;

    right:35px;

    color:white;

    font-size:45px;

    cursor:pointer;

}

.prev,.next{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    font-size:55px;

    color:white;

    cursor:pointer;

    padding:15px;

}

.prev{

    left:25px;

}

.next{

    right:25px;

}

footer{

    background:#081F42;

    color:white;

    text-align:center;

    padding:30px;

}

</style>

</head>

<body>

<section class="gallery-header">

<h1>Photo Gallery</h1>

<p>Moments from Service • Fellowship • Leadership</p>

</section>

<div class="filter">

<button class="active">All</button>

<button>Service</button>

<button>Events</button>

<button>Installation</button>

<button>Training</button>

<button>Fellowship</button>

</div>

<section class="gallery">

<div class="item">
<img src="images/gallery1.jpg">
<div class="overlay">
<i class="fas fa-search-plus"></i>
</div>
</div>

<div class="item">
<img src="images/gallery2.jpg">
<div class="overlay">
<i class="fas fa-search-plus"></i>
</div>
</div>

<div class="item">
<img src="images/gallery3.jpg">
<div class="overlay">
<i class="fas fa-search-plus"></i>
</div>
</div>

<div class="item">
<img src="images/gallery4.jpg">
<div class="overlay">
<i class="fas fa-search-plus"></i>
</div>
</div>

<div class="item">
<img src="images/gallery5.jpg">
<div class="overlay">
<i class="fas fa-search-plus"></i>
</div>
</div>

<div class="item">
<img src="images/gallery6.jpg">
<div class="overlay">
<i class="fas fa-search-plus"></i>
</div>
</div>

<div class="item">
<img src="images/gallery7.jpg">
<div class="overlay">
<i class="fas fa-search-plus"></i>
</div>
</div>

<div class="item">
<img src="images/gallery8.jpg">
<div class="overlay">
<i class="fas fa-search-plus"></i>
</div>
</div>

</section>

<!-- Lightbox -->

<div class="lightbox" id="lightbox">

<span class="close">&times;</span>

<span class="prev">&#10094;</span>

<img id="lightboxImg">

<span class="next">&#10095;</span>

</div>

<footer>

© 2026 RAC SOUTH TIMES

<br>

Official Digital Magazine of Rotaract Club of Cumilla South

</footer>

<script>

const images=document.querySelectorAll(".gallery img");

const lightbox=document.getElementById("lightbox");

const lightboxImg=document.getElementById("lightboxImg");

const close=document.querySelector(".close");

const prev=document.querySelector(".prev");

const next=document.querySelector(".next");

let current=0;

function showImage(index){

current=index;

lightbox.style.display="flex";

lightboxImg.src=images[index].src;

}

images.forEach((img,index)=>{

img.onclick=()=>showImage(index);

});

close.onclick=()=>lightbox.style.display="none";

next.onclick=()=>{

current=(current+1)%images.length;

showImage(current);

};

prev.onclick=()=>{

current=(current-1+images.length)%images.length;

showImage(current);

};

lightbox.onclick=(e)=>{

if(e.target===lightbox){

lightbox.style.display="none";

}

};

document.addEventListener("keydown",(e)=>{

if(lightbox.style.display==="flex"){

if(e.key==="Escape") lightbox.style.display="none";

if(e.key==="ArrowRight") next.click();

if(e.key==="ArrowLeft") prev.click();

}

});

</script>

</body>
</html>
