<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Current Issue | RAC SOUTH TIMES</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<style>

body{
background:#eef3f8;
}

.issue-header{

padding:70px 20px;

text-align:center;

background:linear-gradient(135deg,#005DAA,#003A70);

color:#fff;

}

.issue-header h1{

font-size:50px;

margin-bottom:10px;

}

.issue-header p{

font-size:18px;

}

#flipbook{

width:900px;

height:600px;

margin:60px auto;

background:#fff;

box-shadow:0 20px 40px rgba(0,0,0,.2);

}

.page{

display:flex;

justify-content:center;

align-items:center;

font-size:30px;

background:#fff;

}

.controls{

text-align:center;

margin-bottom:40px;

}

.controls button{

padding:12px 30px;

margin:10px;

border:none;

border-radius:8px;

cursor:pointer;

background:#005DAA;

color:#fff;

font-size:16px;

}

.controls button:hover{

background:#F7A81B;

color:#111;

}

.download{

text-align:center;

margin-bottom:60px;

}

.download a{

display:inline-block;

padding:15px 35px;

background:#F7A81B;

text-decoration:none;

color:#111;

font-weight:bold;

border-radius:30px;

}

@media(max-width:900px){

#flipbook{

width:100%;

height:500px;

}

}

</style>

</head>

<body>

<section class="issue-header">

<h1>Current Issue</h1>

<p>
Read the latest edition of
RAC SOUTH TIMES
</p>

</section>

<div id="flipbook">

<div class="page">
<img src="images/cover.jpg" width="100%">
</div>

<div class="page">
<img src="images/page1.jpg" width="100%">
</div>

<div class="page">
<img src="images/page2.jpg" width="100%">
</div>

<div class="page">
<img src="images/page3.jpg" width="100%">
</div>

<div class="page">
<img src="images/page4.jpg" width="100%">
</div>

<div class="page">
<img src="images/backcover.jpg" width="100%">
</div>

</div>

<div class="controls">

<button onclick="flipBook.flipPrev()">

<i class="fas fa-arrow-left"></i>

Previous

</button>

<button onclick="flipBook.flipNext()">

Next

<i class="fas fa-arrow-right"></i>

</button>

</div>

<div class="download">

<a href="magazines/RAC-SOUTH-TIMES.pdf" download>

<i class="fas fa-download"></i>

Download PDF

</a>

</div>

<script>

const flipBook = new St.PageFlip(

document.getElementById("flipbook"),

{

width:450,

height:600,

size:"stretch",

minWidth:300,

maxWidth:700,

minHeight:400,

maxHeight:900,

showCover:true,

mobileScrollSupport:true

}

);

flipBook.loadFromHTML(document.querySelectorAll(".page"));

</script>

</body>

</html>
